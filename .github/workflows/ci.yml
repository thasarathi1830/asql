name: PHANTOM CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    name: Python Analytics & Risk Engine Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: analytics/requirements.txt
      - name: Install dependencies
        run: pip install -r analytics/requirements.txt
      - name: Run pytest suite
        working-directory: analytics
        run: pytest tests/ -v

  frontend-build:
    name: Frontend Typecheck, Lint, Test & Build
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://placeholder.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: placeholder-anon-key
      VITE_ENABLE_DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Run frontend tests
        working-directory: frontend
        run: npm test
      - name: Production build
        working-directory: frontend
        run: npm run build

  blockchain-tests:
    name: Blockchain Smart Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: blockchain/package-lock.json
      - name: Install blockchain dependencies
        working-directory: blockchain
        run: npm install
      - name: Compile and test smart contract
        working-directory: blockchain
        run: npx hardhat test

